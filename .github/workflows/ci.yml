# CI: правила платформы + тесты на каждый PR (push в основную ветку проверяет deploy.yml,
# вызывая этот же workflow). В PR дополнительно показывается план миграции для production.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Правила рантайма Telegram Serverless
        run: npm run check
      - name: Тесты
        run: npm test

  schema-plan:
    name: Schema plan (production)
    # Секреты недоступны в PR из форков; без настроенного production — пропускаем
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(vars.DEPLOY_ENVIRONMENTS, 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/schema-check.mjs --report-only
        env:
          DEPLOY_ENV: production
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_PRODUCTION }}
