# «Будильник» для напоминаний: у Telegram Serverless нет встроенного cron.
#
# Раз в 5 минут для каждого окружения из DEPLOY_ENVIRONMENTS запускает
# tgcloud/endpoints/tick.js (`npx tgcloud run`) — из тега deployed-<env>,
# то есть ровно тот код, что задеплоен. Окружение без тега пропускается.
#
# GitHub не гарантирует точность расписания: запуски бывают с задержкой.
# Между запусками напоминания всё равно уходят при любом сообщении боту
# или открытии мини-приложения.
name: Tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            secret: TGCLOUD_TOKEN_STAGING
          - environment: production
            secret: TGCLOUD_TOKEN_PRODUCTION
    name: Tick ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: tick-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Окружение задеплоено?
        id: gate
        env:
          ENABLED: ${{ contains(vars.DEPLOY_ENVIRONMENTS, matrix.environment) }}
          TAG: deployed-${{ matrix.environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ENABLED" = "true" ] && git ls-remote --exit-code --tags "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" >/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Окружение не настроено или ещё не задеплоено — пропускаю"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: deployed-${{ matrix.environment }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx tgcloud run endpoints/tick '{}'
        env:
          TGCLOUD_TOKEN: ${{ secrets[matrix.secret] }}
