# Автодеплой при пуше в main: тесты → push модулей и мини-приложения → безопасные миграции.
# Включение: секрет TGCLOUD_TOKEN и переменная репозитория DEPLOY_ENABLED=true.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tgcloud push
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      - run: npx tgcloud migrate --safe
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
