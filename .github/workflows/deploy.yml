# CD: push в master (прод) → тесты → staging → production.
#
# Настройка (Settings → Secrets and variables → Actions):
#   переменная DEPLOY_ENVIRONMENTS — какие окружения есть: "staging,production" или "production"
#   секреты TGCLOUD_TOKEN_STAGING / TGCLOUD_TOKEN_PRODUCTION — CLI-токены ботов
#     (@BotFather → бот → Serverless → CLI Access → Access token)
#   окружение production (Settings → Environments) — по желанию с обязательным подтверждением
#
# Ручной запуск (Actions → Deploy → Run workflow):
#   staging    — любая ветка, тег или коммит (так проверяются ветки PR до мержа);
#   production — только при запуске из master; в ref можно указать старый коммит (откат).
#                Код, не влитый в master, в production не попадает.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Ветка, тег или коммит; пусто — ветка, выбранная выше (откат — укажите старый коммит)
        type: string
        default: ''
      allow_unsafe_migrations:
        description: Разрешить опасные миграции (удаление колонок/таблиц)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  staging:
    needs: ci
    if: >-
      (github.event_name == 'push' && contains(vars.DEPLOY_ENVIRONMENTS, 'staging')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: write
    with:
      environment: staging
      ref: ${{ inputs.ref || github.sha }}
      allow_unsafe_migrations: ${{ inputs.allow_unsafe_migrations == true }}
    secrets:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_STAGING }}

  production:
    needs: [ci, staging]
    # В production — только если staging прошёл или не настроен
    if: >-
      always() && needs.ci.result == 'success' &&
      (needs.staging.result == 'success' || needs.staging.result == 'skipped') &&
      ((github.event_name == 'push' && contains(vars.DEPLOY_ENVIRONMENTS, 'production')) ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref_name == 'master'))
    uses: ./.github/workflows/_deploy.yml
    permissions:
      contents: write
    with:
      environment: production
      ref: ${{ inputs.ref || github.sha }}
      allow_unsafe_migrations: ${{ inputs.allow_unsafe_migrations == true }}
    secrets:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_PRODUCTION }}
