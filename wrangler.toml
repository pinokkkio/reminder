name = "telegram-reminder-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Часовой пояс по умолчанию для новых пользователей (меняется командой /tz)
DEFAULT_TZ = "Europe/Moscow"

# Проверка напоминаний раз в минуту
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "reminder-db"
# Подставьте id из вывода `npx wrangler d1 create reminder-db`
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Секреты (не храните в репозитории!):
#   npx wrangler secret put BOT_TOKEN       — токен от @BotFather
#   npx wrangler secret put WEBHOOK_SECRET  — любая случайная строка [A-Za-z0-9_-]
